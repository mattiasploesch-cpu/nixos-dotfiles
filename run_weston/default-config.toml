[programs.alacritty]
# Argumente sind frei konfigurierbar, z. B. eine eigene Konfigurationsdatei:
#   command = ["alacritty", "--config-file", "/pfad/alacritty.toml"]
command = ["alacritty"]
requires = ["niri"]
unset_env = ["DISPLAY"]


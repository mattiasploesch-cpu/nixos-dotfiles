# ---------------------------------------------------------------------------
# Electron / Qt-Clients (Chat, Musik, Editoren)
# ---------------------------------------------------------------------------

[programs.discord]
# Ohne das Flag weicht Electron auf X11 aus (kein Xwayland -> Absturz).
# --disable-gpu verhindert den GPU-Prozess-Absturz, den Spotify im
# verschachtelten Weston ebenfalls zeigt.
command = ["discord", "--ozone-platform=wayland", "--disable-gpu"]
requires = ["niri"]
startup_timeout = 25
unset_env = ["DISPLAY"]

[programs.spotify]
# Ohne --ozone-platform=wayland beendet sich Spotify still mit Exit 1.
command = ["spotify", "--ozone-platform=wayland", "--disable-gpu"]
requires = ["niri"]
startup_timeout = 25
unset_env = ["DISPLAY"]

[programs.code]

startup_timeout = 20

[programs.wf-recorder]
command = ["wf-recorder", "-f", "/tmp/run-weston-aufnahme.mp4"]
requires = ["niri"]
ready_check = "process"

[programs.brightnessctl]
command = ["brightnessctl", "info"]
requires = ["weston"]
ready_check = "exit"

[programs.playerctl]
